name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/docker-site
            sudo git pull
            sudo docker build -t  docker-site .
            sudo docker stop docker-site-container || true
            sudo docker rm docker-site-container || true
            sudo docker run -d -p 80:80 --name docker-site-container docker-site
